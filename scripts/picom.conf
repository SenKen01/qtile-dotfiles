# Рендеринг (glx обеспечивает плавную работу и блюр)
backend = "glx";
vsync = true;

# Прозрачность окон
active-opacity = 0.90;      # Активное окно (90% непрозрачности)
inactive-opacity = 0.80;    # Неактивные окна (80% непрозрачности)
frame-opacity = 0.90;       # Прозрачность рамок и панели

# Исключения (чтобы видео или полноэкранные игры не просвечивали)
opacity-rule = [
    "100:fullscreen",
    "95:class_g = 'qtile'"
];

# Скругление углов окон (в едином стиле)
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Размытие фона под полупрозрачными окнами (Blur)
blur: {
    method = "dual_kawase";
    strength = 5;
    background = true;
}

# Плавные анимации появления/закрытия окон
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;