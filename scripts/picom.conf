# Рендеринг
backend = "glx";
vsync = true;

# Прозрачность окон
active-opacity = 0.88;
inactive-opacity = 0.78;
frame-opacity = 0.90;

# Исключения для полноэкранного режима
opacity-rule = [
    "100:fullscreen"
];

# Скругление углов окон
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Стандартное размытие фона (стабильно работает в Debian 13)
blur-method = "gaussian";
blur-size = 10;
blur-deviation = 5.0;
blur-background = true;

# Плавные анимации
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
